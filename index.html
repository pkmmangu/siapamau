<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIAPA MAU</title>
  <link rel="icon" href="https://puskesmasmanguharjo.madiunkota.go.id/wp-content/uploads/2025/10/icon-app-pkm.png" type="image/x-icon">
  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #ffffff;
    }

    /* --- SPLASH SCREEN --- */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(145deg, #f0f7fe 0%, #ffffff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* --- WRAPPER IKON (lingkaran dengan gradien) --- */
    .icon-wrapper {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: linear-gradient(135deg, #22c55e, #3b82f6); /* hijau ke biru */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
    }

    .icon-wrapper svg {
      width: 72px;
      height: 72px;
      fill: white;
    }

    /* --- TEKS --- */
    .splash-title {
      font-size: 2.4rem;
      font-weight: 700;
      color: #0b2a4a;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .splash-sub {
      font-size: 1rem;
      font-weight: 500;
      color: #3a5a7a;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* --- ANIMASI TITIK-TITIK --- */
    .dots {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dots span {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #0d6efd;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dots span:nth-child(1) { animation-delay: 0s; }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.4;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* --- IFRAME (di belakang splash) --- */
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <!-- Lingkaran ikon dengan gradien -->
    <div class="icon-wrapper">
      <svg viewBox="0 0 1280 1280" xmlns="http://www.w3.org/2000/svg">
        <use href="#icon-app" />
      </svg>
    </div>

    <div class="splash-title">SIAPA MAU</div>
    <div class="splash-sub">UPTD PUSKESMAS MANGUHARJO</div>

    <!-- Animasi titik-titik -->
    <div class="dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- IFRAME -->
  <div class="iframe-container">
    <iframe 
      src="https://script.google.com/macros/s/AKfycbxa-8ar6m3hKMWra509pOVDSR46PxMcdlhf8yERAO3bxs3NqYYtUcgrnNnlhEQNzQPx/exec" 
      title="SIAPA MAU"
      onload="document.getElementById('splash').classList.add('hidden');"
      allowfullscreen>
    </iframe>
  </div>

      document.getElementById('splash').classList.add('hidden');
